<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Topologia de referência da AzureShop no Azure</title>
  <desc id="desc">Diagrama sanitizado com App Service, AKS, ACR, VNet Peering, Private Endpoint para SQL, identidade gerenciada, Key Vault, Foundry e Monitor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c2410c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 15px Arial, sans-serif; }
      .zone { stroke-width: 2; rx: 18; ry: 18; }
      .zone-title { font: 700 18px Arial, sans-serif; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; ry: 12; filter: url(#shadow); }
      .node-title { fill: #0f172a; font: 700 16px Arial, sans-serif; }
      .node-text { fill: #475569; font: 400 13px Arial, sans-serif; }
      .small { fill: #475569; font: 400 12px Arial, sans-serif; }
      .edge { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .edge-orange { fill: none; stroke: #c2410c; stroke-width: 2.5; marker-end: url(#arrowOrange); }
      .edge-dash { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .label { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 5; ry: 5; }
      .label-text { fill: #334155; font: 600 12px Arial, sans-serif; }
      .badge { rx: 8; ry: 8; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1080"/>
  <text x="60" y="55" class="title">AzureShop — Topologia de Referência</text>
  <text x="60" y="82" class="subtitle">Diagrama sanitizado para documentação. Nomes, regiões, modelos, quotas e capacidades não confirmados usam [definir].</text>

  <!-- Entry and delivery -->
  <rect x="60" y="120" width="280" height="220" fill="#eff6ff" stroke="#2563eb" class="zone"/>
  <text x="84" y="152" fill="#1d4ed8" class="zone-title">Acesso e aplicação PaaS</text>
  <rect x="92" y="185" width="216" height="54" class="node"/>
  <text x="112" y="209" class="node-title">Usuário</text>
  <text x="112" y="228" class="node-text">HTTPS</text>
  <rect x="92" y="260" width="216" height="58" class="node"/>
  <text x="112" y="285" class="node-title">Azure App Service</text>
  <text x="112" y="304" class="node-text">AzureShop + /api/health</text>
  <path d="M200 239 L200 260" class="edge"/>

  <rect x="60" y="390" width="280" height="160" fill="#f5f3ff" stroke="#7c3aed" class="zone"/>
  <text x="84" y="422" fill="#6d28d9" class="zone-title">Build e registro</text>
  <rect x="92" y="452" width="96" height="60" class="node"/>
  <text x="110" y="478" class="node-title">Código</text>
  <text x="108" y="497" class="node-text">Dockerfile</text>
  <rect x="212" y="452" width="96" height="60" class="node"/>
  <text x="232" y="478" class="node-title">ACR</text>
  <text x="223" y="497" class="node-text">imagens</text>
  <path d="M188 482 L212 482" class="edge-dash"/>

  <!-- App VNet -->
  <rect x="390" y="120" width="520" height="430" fill="#ecfdf5" stroke="#15803d" class="zone"/>
  <text x="415" y="152" fill="#166534" class="zone-title">VNet da aplicação — vnet-imersao</text>
  <rect x="420" y="184" width="205" height="92" class="node"/>
  <text x="440" y="210" class="node-title">VNet Integration</text>
  <text x="440" y="231" class="node-text">Subnet dedicada</text>
  <text x="440" y="250" class="node-text">Microsoft.Web/serverFarms</text>
  <rect x="660" y="184" width="215" height="92" class="node"/>
  <text x="680" y="210" class="node-title">Private DNS Zone</text>
  <text x="680" y="231" class="node-text">privatelink.database</text>
  <text x="680" y="250" class="node-text">.windows.net</text>
  <rect x="420" y="325" width="205" height="100" class="node"/>
  <text x="440" y="351" class="node-title">snet-dados</text>
  <text x="440" y="372" class="node-text">NSG restrito</text>
  <text x="440" y="391" class="node-text">TCP 1433</text>
  <rect x="660" y="325" width="215" height="100" class="node"/>
  <text x="680" y="351" class="node-title">Private Endpoint</text>
  <text x="680" y="372" class="node-text">Subrecurso: sqlServer</text>
  <text x="680" y="391" class="node-text">IP privado: [definir]</text>
  <path d="M308 289 L420 230" class="edge-green"/>
  <path d="M520 276 L520 325" class="edge-green"/>
  <path d="M625 375 L660 375" class="edge-green"/>
  <path d="M625 230 L660 230" class="edge-dash"/>

  <!-- AKS VNet -->
  <rect x="960" y="120" width="580" height="430" fill="#eff6ff" stroke="#2563eb" class="zone"/>
  <text x="985" y="152" fill="#1d4ed8" class="zone-title">VNet gerenciada do AKS — [definir]</text>
  <rect x="992" y="184" width="220" height="92" class="node"/>
  <text x="1012" y="210" class="node-title">Azure Kubernetes Service</text>
  <text x="1012" y="231" class="node-text">Cluster: [definir]</text>
  <text x="1012" y="250" class="node-text">Identidade do kubelet</text>
  <rect x="1260" y="184" width="245" height="92" class="node"/>
  <text x="1280" y="210" class="node-title">Pods AzureShop</text>
  <text x="1280" y="231" class="node-text">Deployment e probes</text>
  <text x="1280" y="250" class="node-text">Imagem via AcrPull</text>
  <rect x="1090" y="365" width="330" height="78" class="node"/>
  <text x="1110" y="393" class="node-title">VNet Peering bidirecional</text>
  <text x="1110" y="414" class="node-text">Conectividade IP; DNS privado continua obrigatório</text>
  <path d="M1212 230 L1260 230" class="edge"/>
  <path d="M308 482 L992 230" class="edge-dash"/>
  <path d="M1260 276 L1260 365" class="edge"/>
  <path d="M1090 404 L910 404" class="edge-green"/>

  <!-- SQL -->
  <rect x="390" y="610" width="520" height="180" fill="#f0fdfa" stroke="#0f766e" class="zone"/>
  <text x="415" y="642" fill="#0f766e" class="zone-title">Dados privados</text>
  <rect x="520" y="680" width="260" height="70" class="node"/>
  <text x="540" y="708" class="node-title">Azure SQL Database</text>
  <text x="540" y="729" class="node-text">Servidor e base: [definir]</text>
  <path d="M767 425 L700 680" class="edge-green"/>
  <rect x="727" y="540" width="120" height="22" class="label"/>
  <text x="738" y="556" class="label-text">TCP 1433</text>

  <!-- AI and security -->
  <rect x="960" y="610" width="580" height="330" fill="#fff7ed" stroke="#c2410c" class="zone"/>
  <text x="985" y="642" fill="#c2410c" class="zone-title">Identidade, IA e observabilidade</text>
  <rect x="992" y="680" width="158" height="72" class="node"/>
  <text x="1012" y="708" class="node-title">Identidade</text>
  <text x="1012" y="729" class="node-text">Gerenciada</text>
  <rect x="1180" y="680" width="158" height="72" class="node"/>
  <text x="1200" y="708" class="node-title">Key Vault</text>
  <text x="1200" y="729" class="node-text">quando necessário</text>
  <rect x="1368" y="680" width="140" height="72" class="node"/>
  <text x="1388" y="708" class="node-title">Foundry</text>
  <text x="1388" y="729" class="node-text">[definir]</text>
  <rect x="1080" y="810" width="170" height="72" class="node"/>
  <text x="1100" y="838" class="node-title">App Insights</text>
  <text x="1100" y="859" class="node-text">telemetria segura</text>
  <rect x="1280" y="810" width="170" height="72" class="node"/>
  <text x="1300" y="838" class="node-title">Monitor + Logs</text>
  <text x="1300" y="859" class="node-text">Log Analytics</text>
  <path d="M1370 276 L1370 680" class="edge-orange"/>
  <path d="M1150 716 L1180 716" class="edge-orange"/>
  <path d="M1338 716 L1368 716" class="edge-orange"/>
  <path d="M1260 276 L1165 810" class="edge-orange"/>
  <path d="M1250 846 L1280 846" class="edge-orange"/>

  <!-- Legend -->
  <rect x="60" y="850" width="850" height="150" fill="#ffffff" stroke="#cbd5e1" class="zone"/>
  <text x="85" y="882" class="zone-title">Legenda e regras de leitura</text>
  <line x1="90" y1="915" x2="170" y2="915" class="edge"/>
  <text x="188" y="920" class="small">Fluxo de aplicação, imagem ou dados</text>
  <line x1="90" y1="948" x2="170" y2="948" class="edge-green"/>
  <text x="188" y="953" class="small">Fluxo privado de rede e Azure SQL</text>
  <line x1="450" y1="915" x2="530" y2="915" class="edge-orange"/>
  <text x="548" y="920" class="small">Identidade, IA e observabilidade</text>
  <line x1="450" y1="948" x2="530" y2="948" class="edge-dash"/>
  <text x="548" y="953" class="small">Build, pull de imagem ou resolução DNS</text>

  <text x="60" y="1040" class="subtitle">Artefato de documentação: não representa inventário, configuração operacional nem autorização para alterar recursos.</text>
</svg>
