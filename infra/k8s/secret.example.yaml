# Exemplo SEM valores reais. Nunca versione um secret.yaml preenchido.
# Preferencial: use o Azure Key Vault via SecretProviderClass (secretproviderclass.yaml)
# e Workload Identity, evitando este Secret estatico.
apiVersion: v1
kind: Secret
metadata:
  name: azure-shop-secrets
  namespace: azure-shop
type: Opaque
stringData:
  sql-server: "SEU_SERVIDOR.database.windows.net"
  sql-database: "imersao"
  sql-user: "PREENCHER"
  sql-password: "PREENCHER"
